<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link th:href="@{/css/list-style.css}" rel="stylesheet" />
    <title>Lista studentów</title>
</head>
<body>
<div class="root">
    <h1>Lista studentów</h1>
    <p>
        <a th:href="@{/projektList}">Lista projektów</a> | 
        <a th:href="@{/zadanieList}">Lista zadań</a>
    </p>
    
    <div class="search-block">
        <form th:action="@{/studentList}" method="GET">
            <label>Szukaj po nazwisku:</label>
            <input type="text" name="nazwisko" th:value="${nazwisko}" />
            <button type="submit">Szukaj</button>
            <a th:href="@{/studentList}">Wyczyść</a>
        </form>
    </div>

    <p>
        <a th:href="@{/studentEdit}">Dodaj studenta</a>
    </p>
    <table>
        <thead>
        <tr>
            <th>Id</th>
            <th>Imię</th>
            <th>Nazwisko</th>
            <th>Nr indeksu</th>
            <th>E-mail</th>
            <th>Stacjonarny</th>
            <th>Edit</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student : ${studenci}">
            <td th:text="${student.studentId}">Id</td>
            <td th:text="${student.imie}">Imię</td>
            <td th:text="${student.nazwisko}">Nazwisko</td>
            <td th:text="${student.nrIndeksu}">Nr indeksu</td>
            <td th:text="${student.email}">E-mail</td>
            <td th:text="${student.stacjonarny ? 'Tak' : 'Nie'}">Stacjonarny</td>
            <td>
                <a th:href="@{/studentEdit(studentId=${student.studentId})}">Edytuj</a><br>
                <a th:href="@{/studentEdit(studentId=${student.studentId}, delete='true')}">Usuń</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="pagination" th:if="${page != null and page.totalPages > 1}">
        <span th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}">
            <a th:href="@{/studentList(page=${i}, size=${page.size}, nazwisko=${nazwisko})}" 
               th:text="${i + 1}" 
               th:classappend="${i == page.number} ? 'active' : ''">1</a>
        </span>
    </div>
</div>
</body>
</html>
